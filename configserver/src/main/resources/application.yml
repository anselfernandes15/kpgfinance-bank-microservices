spring:
  application:
    name: configserver
  profiles:
#    active: native
    active: git

  cloud:
    config:
      server:
#        native:
#          search-locations: classpath:/config
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/anselfernandes15/kpgfinance-bank-microservices.git}
          # Only needed if the config repo is private. Supply via env vars /
          # a Kubernetes Secret - never commit real values.
          username: ${CONFIG_GIT_USERNAME:}
          password: ${CONFIG_GIT_TOKEN:}
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
        monitor:
          validation-filter-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: "development"
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s
  metrics:
    tags:
      application: ${spring.application.name}

encrypt:
  # Symmetric key used to decrypt {cipher} values. Supply via the ENCRYPT_KEY
  # env var / a Kubernetes Secret - never commit the real key.
  key: ${ENCRYPT_KEY:}

server:
  port: 8071

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) %magenta([traceId=%X{traceId:-},spanId=%X{spanId:-}]) - %cyan(%msg%n)}



