deploymentName: loans-deployment
serviceName: loans
appLabel: loans

replicaCount: 1

image:
  repository: anselfernandes7/loans
  tag: s17

containerPort: 9001

service:
  port: 9001
  targetPort: 9001

profileEnabled: true
configImportEnabled: true
discoveryEnabled: true
jwkEnabled: false
redisEnabled: false
kafkaEnabled: false
otelEnabled: true

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 700Mi

startupProbe:
  failureThreshold: 30
  periodSeconds: 5
