deploymentName: configserver-deployment
serviceName: configserver
appLabel: configserver

replicaCount: 1

image:
  repository: anselfernandes7/configserver
  tag: s17

containerPort: 8071

service:
  port: 8071
  targetPort: 8071

profileEnabled: false
configImportEnabled: false
discoveryEnabled: false
jwkEnabled: false
redisEnabled: false
kafkaEnabled: false
otelEnabled: true

# Secret (created out-of-band, never committed) holding ENCRYPT_KEY and,
# for a private config repo, CONFIG_GIT_USERNAME / CONFIG_GIT_TOKEN.
envFromSecret: configserver-secrets

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 700Mi

startupProbe:
  failureThreshold: 30
  periodSeconds: 5
